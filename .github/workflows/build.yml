name: build-apk
on:
  push:
    branches: [main, feat/wav-inject, feat/floating-send]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK/NDK (runner's sdkmanager)
        run: |
          set -e
          if [ -z "${ANDROID_HOME:-}" ]; then export ANDROID_HOME=/usr/local/lib/android/sdk; fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleRelease 2>&1 | tee build.log
      - name: Save build log on failure
        if: failure()
        working-directory: android
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git checkout -B build-log
          git add -f build.log
          git commit -m "build log run ${GITHUB_RUN_NUMBER}" || true
          git push -f origin build-log
      - run: cp android/app/build/outputs/apk/release/app-release.apk VoiceStudio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: VoiceStudio.apk
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" VoiceStudio.apk             --title "Voice Studio APK ${GITHUB_RUN_NUMBER}"             --notes "Automated build from $GITHUB_SHA"

